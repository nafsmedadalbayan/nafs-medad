<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسبار — تصحيح وتحليل الاختبارات وقراءة أوراق OMR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script async src="https://docs.opencv.org/4.x/opencv.js"></script>
<style>
  :root{
    --ink:#1c2321;
    --paper:#f6f4ee;
    --panel:#ffffff;
    --teal:#1f5d5a;
    --teal-deep:#123f3d;
    --teal-soft:#dbe9e6;
    --gold:#c08a2e;
    --danger:#a8432c;
    --line:#d9d3c3;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--paper);color:var(--ink);}
  h1,h2,h3{margin:0 0 4px 0;font-weight:700;}
  p{margin:0;}
  button{font-family:inherit;cursor:pointer;border:none;}
  input,select{font-family:inherit;}

  /* ---------- login ---------- */
  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--teal-deep),var(--teal) 70%);}
  .loginCard{background:var(--panel);width:min(380px,90vw);padding:36px 30px;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .loginCard .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .bubble-mark{width:34px;height:34px;border-radius:50%;border:3px solid var(--teal);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--teal);flex:none;}
  .loginCard label{display:block;font-size:13px;color:#555;margin:14px 0 6px;}
  .loginCard input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;}
  .loginCard button{width:100%;margin-top:20px;background:var(--teal);color:#fff;padding:11px;border-radius:8px;font-weight:600;font-size:15px;}
  .loginCard button:hover{background:var(--teal-deep);}
  #loginError{color:var(--danger);font-size:13px;margin-top:10px;min-height:16px;}

  /* ---------- app shell ---------- */
  #app{display:none;min-height:100vh;grid-template-columns:220px 1fr;}
  #app.on{display:grid;}
  aside{background:var(--teal-deep);color:#eaf3f1;padding:22px 14px;display:flex;flex-direction:column;}
  aside .brand{display:flex;align-items:center;gap:10px;padding:0 6px 20px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px;}
  aside .brand .bubble-mark{border-color:#eaf3f1;color:#eaf3f1;}
  aside nav button{display:block;width:100%;text-align:right;background:none;color:#cfe3e0;padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:4px;}
  aside nav button:hover{background:rgba(255,255,255,.08);}
  aside nav button.active{background:var(--gold);color:#241a04;font-weight:600;}
  aside .logout{margin-top:auto;background:none;color:#cfe3e0;text-align:right;padding:10px 12px;font-size:13px;opacity:.75;}
  aside .logout:hover{opacity:1;}

  main{padding:26px 34px;max-width:1180px;}
  .viewHead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
  .viewHead h2{font-size:22px;}
  .viewHead .sub{color:#6b6459;font-size:13px;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:12.5px;color:#5c564b;}
  .field input,.field select{padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:14px;min-width:160px;}
  .btn{background:var(--teal);color:#fff;padding:9px 18px;border-radius:7px;font-size:14px;font-weight:600;}
  .btn:hover{background:var(--teal-deep);}
  .btn.secondary{background:var(--teal-soft);color:var(--teal-deep);}
  .btn.secondary:hover{background:#c9ded9;}
  .btn.danger{background:#f4e2dc;color:var(--danger);}
  .btn.danger:hover{background:#ecccc1;}
  .btn.small{padding:6px 12px;font-size:12.5px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);}
  th{color:#5c564b;font-weight:600;font-size:12.5px;}
  tr:last-child td{border-bottom:none;}
  .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;background:var(--teal-soft);color:var(--teal-deep);}
  .muted{color:#8a8375;font-size:12.5px;}
  .empty{padding:30px 10px;text-align:center;color:#8a8375;font-size:14px;}

  /* bubble answer grid — echoes the paper OMR sheet */
  .bubbleGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px;}
  .qrow{display:flex;align-items:center;gap:6px;background:#faf9f5;border:1px solid var(--line);border-radius:8px;padding:5px 8px;}
  .qrow .qnum{font-size:12px;color:#6b6459;width:20px;text-align:center;font-weight:600;}
  .qrow .opt{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--teal);color:var(--teal);background:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:600;}
  .qrow .opt.sel{background:var(--teal);color:#fff;}
  .qrow .opt.correct-mark{outline:2px solid #3a8a4a;}
  .qrow .opt.wrong-mark{outline:2px solid var(--danger);}

  .barBg{background:#eee7d8;border-radius:6px;overflow:hidden;height:8px;width:100%;}
  .barFill{height:100%;background:var(--teal);}
  .pct{font-weight:700;}
  .pct.low{color:var(--danger);}
  .pct.mid{color:var(--gold);}
  .pct.high{color:#2d7a44;}

  .delta.up{color:#2d7a44;}
  .delta.down{color:var(--danger);}

  .chartBox{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:18px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media(max-width:900px){.grid2{grid-template-columns:1fr;} #app.on{grid-template-columns:1fr;} aside{position:sticky;top:0;z-index:5;}}
  .studentRow{display:flex;align-items:center;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--line);}
  .studentRow:last-child{border-bottom:none;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--teal-deep);color:#fff;padding:10px 20px;border-radius:8px;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;}
  .toast.show{opacity:1;}

  .omr-upload{border:2px dashed var(--line);border-radius:10px;padding:18px;background:#faf9f5;margin-top:12px;}
  .omr-preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:14px;}
  .omr-preview{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px;}
  .omr-preview img{width:100%;height:170px;object-fit:contain;background:#eee;border-radius:6px;}
  .omr-preview .omr-name{font-size:12px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .omr-status{font-size:12px;margin-top:4px;}
  .omr-ok{color:#2d7a44}.omr-warn{color:var(--gold)}.omr-err{color:var(--danger)}
  .omr-result{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#faf9f5;}
  .omr-progress{margin-top:10px;padding:10px;border-radius:8px;background:#eef5f3;border:1px solid #cfe0dc;}
  .omr-progress strong{color:var(--teal-deep);}
  .omr-confidence{font-size:11px;color:#6b6459;margin-right:6px;}
  .omr-review-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .omr-review-pill{padding:3px 8px;border-radius:14px;background:#f4e2dc;color:var(--danger);font-size:11px;}

</style>
</head>
<body>

<div id="loginScreen">
  <div class="loginCard">
    <div class="brand"><div class="bubble-mark">أ</div><div><h1 style="font-size:18px;">مسبار</h1><p class="muted">تصحيح وتحليل الاختبارات</p></div></div>
    <label>البريد الإلكتروني</label>
    <input id="loginEmail" type="email" placeholder="admin@example.com">
    <label>كلمة المرور</label>
    <input id="loginPass" type="password" placeholder="••••••••">
    <button class="btn" style="width:100%;margin-top:20px;" onclick="doLogin()">تسجيل الدخول</button>
    <div id="loginError"></div>
    <p class="muted" style="margin-top:16px;line-height:1.7;">أنشئ حساب الأدمن مرة واحدة من Authentication → Users في مشروع Supabase، ثم سجّل دخولك هنا.</p>
  </div>
</div>

<div id="app">
  <aside>
    <div class="brand"><div class="bubble-mark">أ</div><div><h1 style="font-size:16px;">مسبار</h1></div></div>
    <nav id="navList"></nav>
    <button class="logout" onclick="doLogout()">تسجيل الخروج</button>
  </aside>
  <main id="mainView"></main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================== إعداد Supabase ============================== */
const SUPABASE_URL = 'https://aztsbtuypyoevhrupeen.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF6dHNidHV5cHlvZXZocnVwZWVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NTQ1MjAsImV4cCI6MjEwNDAzMDUyMH0.v8E5x0cjzDaXVDzp3_qc2sh_4Oz5M2ou7oubJsnlksI';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const GRADE_SUBJECTS = {
  'ثالث ابتدائي': ['لغتي','رياضيات'],
  'سادس ابتدائي': ['لغتي','رياضيات','علوم'],
  'ثالث متوسط': ['لغتي','رياضيات','علوم']
};
const LETTERS = ['أ','ب','ج','د'];

let STATE = { classes:[], students:[], exams:[], view:'classes', chart1:null, chart2:null };

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
function pctClass(p){ return p>=80?'high':(p>=60?'mid':'low'); }
function fmt(n){ return Math.round(n*10)/10; }

/* ============================== المصادقة ============================== */
async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errBox = document.getElementById('loginError');
  errBox.textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error){ errBox.textContent = 'بيانات الدخول غير صحيحة'; return; }
  enterApp();
}
async function doLogout(){
  await sb.auth.signOut();
  document.getElementById('app').classList.remove('on');
  document.getElementById('loginScreen').style.display = 'flex';
}
async function checkSession(){
  const { data } = await sb.auth.getSession();
  if (data.session) enterApp(); else document.getElementById('loginScreen').style.display='flex';
}
async function enterApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('on');
  await loadAll();
  renderNav();
  setView('classes');
}

/* ============================== تحميل البيانات ============================== */
async function loadAll(){
  const [c,s,e] = await Promise.all([
    sb.from('classes').select('*').order('name'),
    sb.from('students').select('*').order('name'),
    sb.from('exams').select('*').order('exam_date', {ascending:false})
  ]);
  STATE.classes = c.data || [];
  STATE.students = s.data || [];
  STATE.exams = e.data || [];
}

/* ============================== التنقل ============================== */
const NAV = [
  {id:'classes', label:'الفصول'},
  {id:'students', label:'الطلاب ونقلهم'},
  {id:'examCreate', label:'إنشاء اختبار'},
  {id:'grading', label:'تصحيح الإجابات'},
  {id:'results', label:'نتائج اختبار'},
  {id:'studentProfile', label:'ملف الطالب'},
  {id:'classTrend', label:'تطور الفصل'},
];
function renderNav(){
  const nav = document.getElementById('navList');
  nav.innerHTML = NAV.map(n=>`<button data-id="${n.id}" onclick="setView('${n.id}')">${n.label}</button>`).join('');
}
function setView(id){
  STATE.view = id;
  document.querySelectorAll('#navList button').forEach(b=>b.classList.toggle('active', b.dataset.id===id));
  const renderers = { classes:renderClasses, students:renderStudents, examCreate:renderExamCreate, grading:renderGrading, results:renderResults, studentProfile:renderStudentProfile, classTrend:renderClassTrend };
  renderers[id]();
}

/* ============================== 1) الفصول ============================== */
function renderClasses(){
  const main = document.getElementById('mainView');
  main.innerHTML = `
    <div class="viewHead"><div><h2>الفصول</h2><p class="sub">أضف فصلاً وحدد صفه الدراسي — يحدد ذلك مواد الاختبار تلقائياً</p></div></div>
    <div class="card">
      <div class="row">
        <div class="field"><label>اسم الفصل</label><input id="clsName" placeholder="مثال: سادس / 2"></div>
        <div class="field"><label>الصف</label>
          <select id="clsGrade">${Object.keys(GRADE_SUBJECTS).map(g=>`<option value="${g}">${g}</option>`).join('')}</select>
        </div>
        <button class="btn" onclick="addClass()">إضافة الفصل</button>
      </div>
    </div>
    <div class="card">
      <table><thead><tr><th>الفصل</th><th>الصف</th><th>المواد</th><th>عدد الطلاب</th><th></th></tr></thead>
      <tbody>${STATE.classes.map(c=>{
        const count = STATE.students.filter(s=>s.class_id===c.id).length;
        return `<tr><td>${c.name}</td><td><span class="tag">${c.grade}</span></td><td class="muted">${GRADE_SUBJECTS[c.grade].join(' / ')}</td><td>${count}</td>
        <td><button class="btn danger small" onclick="deleteClass('${c.id}')">حذف</button></td></tr>`;
      }).join('') || `<tr><td colspan="5" class="empty">لا توجد فصول بعد</td></tr>`}</tbody></table>
    </div>`;
}
async function addClass(){
  const name = document.getElementById('clsName').value.trim();
  const grade = document.getElementById('clsGrade').value;
  if(!name){ toast('أدخل اسم الفصل'); return; }
  const { error } = await sb.from('classes').insert({ name, grade });
  if (error){ toast('تعذّرت الإضافة'); return; }
  await loadAll(); toast('تمت إضافة الفصل'); renderClasses();
}
async function deleteClass(id){
  if(!confirm('حذف الفصل سيحذف اختباراته المرتبطة به. متابعة؟')) return;
  await sb.from('classes').delete().eq('id', id);
  await loadAll(); renderClasses();
}

/* ============================== 2) الطلاب ونقلهم ============================== */
function renderStudents(){
  const main = document.getElementById('mainView');
  const classOpts = STATE.classes.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  main.innerHTML = `
    <div class="viewHead"><div><h2>الطلاب</h2><p class="sub">أدخل أسماء الطلاب بترتيب رفع الإجابات، ويمكنك نقل الطالب بين الفصول مع بقاء كل نتائجه السابقة</p></div></div>
    <div class="card">
      <div class="row">
        <div class="field"><label>اسم الطالب</label><input id="stuName" placeholder="اسم الطالب"></div>
        <div class="field"><label>الفصل</label><select id="stuClass">${classOpts}</select></div>
        <button class="btn" onclick="addStudent()">إضافة طالب</button>
      </div>
    </div>
    <div class="card">
      <div class="row" style="margin-bottom:10px;">
        <div class="field"><label>عرض فصل</label><select id="stuFilter" onchange="renderStudents()"><option value="">كل الفصول</option>${classOpts}</select></div>
      </div>
      ${renderStudentsTable()}
    </div>`;
}
function renderStudentsTable(){
  const filter = document.getElementById('stuFilter')?.value || '';
  const list = STATE.students.filter(s=>!filter || s.class_id===filter);
  if(!list.length) return `<div class="empty">لا يوجد طلاب</div>`;
  return `<table><thead><tr><th>الاسم</th><th>الفصل الحالي</th><th>نقل إلى</th><th></th></tr></thead><tbody>
    ${list.map(s=>{
      const cls = STATE.classes.find(c=>c.id===s.class_id);
      const opts = STATE.classes.map(c=>`<option value="${c.id}" ${c.id===s.class_id?'selected':''}>${c.name}</option>`).join('');
      return `<tr><td>${s.name}</td><td><span class="tag">${cls?cls.name:'—'}</span></td>
      <td><select id="mv_${s.id}">${opts}</select></td>
      <td><button class="btn secondary small" onclick="transferStudent('${s.id}')">نقل</button>
      <button class="btn danger small" onclick="deleteStudent('${s.id}')">حذف</button></td></tr>`;
    }).join('')}
  </tbody></table>`;
}
async function addStudent(){
  const name = document.getElementById('stuName').value.trim();
  const class_id = document.getElementById('stuClass').value;
  if(!name || !class_id){ toast('أدخل الاسم واختر الفصل'); return; }
  const { error } = await sb.from('students').insert({ name, class_id });
  if(error){ toast('تعذّرت الإضافة'); return; }
  await loadAll(); document.getElementById('stuName').value=''; renderStudents(); toast('تمت الإضافة');
}
async function transferStudent(id){
  const newClass = document.getElementById('mv_'+id).value;
  await sb.from('students').update({ class_id: newClass }).eq('id', id);
  await loadAll(); renderStudents(); toast('تم نقل الطالب — نتائجه السابقة محفوظة');
}
async function deleteStudent(id){
  if(!confirm('حذف الطالب سيحذف نتائجه أيضاً. متابعة؟')) return;
  await sb.from('students').delete().eq('id', id);
  await loadAll(); renderStudents();
}

/* ============================== 3) إنشاء اختبار ============================== */
function defaultSubjectRanges(subjects, total){
  const each = Math.floor(total/subjects.length);
  let start = 1; const out = {};
  subjects.forEach((sub,i)=>{
    const end = (i===subjects.length-1) ? total : start+each-1;
    out[sub] = [start, end]; start = end+1;
  });
  return out;
}
function renderExamCreate(){
  const main = document.getElementById('mainView');
  if(!STATE.classes.length){ main.innerHTML = `<div class="viewHead"><h2>إنشاء اختبار</h2></div><div class="empty">أضف فصلاً أولاً من تبويب "الفصول"</div>`; return; }
  main.innerHTML = `
    <div class="viewHead"><div><h2>إنشاء اختبار جديد</h2><p class="sub">حدد الفصل والتاريخ وعدد الأسئلة، وسيتم تقسيمها تلقائياً على مواد الصف — يمكنك تعديل الحدود ثم إدخال نموذج الإجابة</p></div></div>
    <div class="card">
      <div class="row">
        <div class="field"><label>الفصل</label><select id="exClass" onchange="onExamClassChange()">${STATE.classes.map(c=>`<option value="${c.id}">${c.name} — ${c.grade}</option>`).join('')}</select></div>
        <div class="field"><label>اسم الاختبار</label><input id="exName" placeholder="مثال: اختبار الأسبوع 3"></div>
        <div class="field"><label>التاريخ</label><input id="exDate" type="date"></div>
        <div class="field"><label>عدد الأسئلة</label><input id="exTotal" type="number" value="60" min="1" onchange="rebuildSubjectRanges()"></div>
        <div class="field" style="flex-direction:row;align-items:center;gap:6px;margin-top:18px;"><input type="checkbox" id="exSim" style="width:auto;"><label style="margin:0;">اختبار محاكي (نافس)</label></div>
      </div>
      <div id="subjectRangesBox" style="margin-top:14px;"></div>
    </div>
    <div class="card">
      <h3 style="font-size:15px;">نموذج الإجابة الصحيحة</h3>
      <p class="muted">اضغط الحرف الصحيح لكل سؤال</p>
      <div id="keyGrid" class="bubbleGrid"></div>
      <div style="margin-top:16px;"><button class="btn" onclick="saveExam()">حفظ الاختبار</button></div>
    </div>`;
  document.getElementById('exDate').valueAsDate = new Date();
  onExamClassChange();
}
let EX_KEY = {};
function onExamClassChange(){
  rebuildSubjectRanges();
}
function rebuildSubjectRanges(){
  const cls = STATE.classes.find(c=>c.id===document.getElementById('exClass').value);
  const total = parseInt(document.getElementById('exTotal').value)||60;
  const subs = GRADE_SUBJECTS[cls.grade];
  const ranges = defaultSubjectRanges(subs, total);
  const box = document.getElementById('subjectRangesBox');
  box.innerHTML = `<div class="row">${subs.map(s=>`
    <div class="field"><label>${s} — من</label><input type="number" id="rs_${s}" value="${ranges[s][0]}" min="1" style="width:80px;"></div>
    <div class="field"><label>${s} — إلى</label><input type="number" id="re_${s}" value="${ranges[s][1]}" min="1" style="width:80px;"></div>
  `).join('')}</div>`;
  box.dataset.subjects = JSON.stringify(subs);
  EX_KEY = {};
  buildKeyGrid(total);
}
function buildKeyGrid(total){
  const grid = document.getElementById('keyGrid');
  let html = '';
  for(let q=1;q<=total;q++){

/* ============================== حساب الدرجات ============================== */
function computeScore(answers, exam){
  const key = exam.answer_key;
  let correct = 0;
  const subjectScores = {};
  Object.entries(exam.subjects).forEach(([subj,[s,e]])=>{
    let c=0, t=0;
    for(let q=s;q<=e;q++){ t++; if(answers[q] && answers[q]===key[q]) c++; }
    subjectScores[subj] = { correct:c, total:t, percent: t? fmt(c/t*100):0 };
    correct += c;
  });
  const total_percent = exam.total_questions ? fmt(correct/exam.total_questions*100) : 0;
  return { correct, total_percent, subjectScores };
}

/* ============================== OMR ENGINE ============================== */
let OMR_CV_READY = false;
window.Module = window.Module || {};
function waitForOpenCV(timeoutMs=15000){
  return new Promise((resolve,reject)=>{
    const t0=Date.now();
    const timer=setInterval(()=>{
      if(window.cv && cv.Mat){
        OMR_CV_READY=true; clearInterval(timer); resolve(true);
      } else if(Date.now()-t0>timeoutMs){
        clearInterval(timer); reject(new Error('لم يتم تحميل محرك قراءة الصور OpenCV'));
      }
    },100);
  });
}

function loadImageElement(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{ URL.revokeObjectURL(url); resolve(img); };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('تعذر فتح صورة الورقة')); };
    img.src=url;
  });
}

function orderQuad(pts){
  const sum=pts.map(p=>p.x+p.y), diff=pts.map(p=>p.x-p.y);
  return [
    pts[sum.indexOf(Math.min(...sum))],
    pts[diff.indexOf(Math.max(...diff))],
    pts[sum.indexOf(Math.max(...sum))],
    pts[diff.indexOf(Math.min(...diff))]
  ];
}

function matPoint(p){ return {x:p.x,y:p.y}; }

function findPageQuad(src){
  let gray=null, blur=null, edges=null, contours=null, hierarchy=null;
  try{
    gray=new cv.Mat(); blur=new cv.Mat(); edges=new cv.Mat(); contours=new cv.MatVector(); hierarchy=new cv.Mat();
    cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray,blur,new cv.Size(5,5),0,0,cv.BORDER_DEFAULT);
    cv.Canny(blur,edges,50,150);
    cv.dilate(edges,edges,cv.Mat.ones(3,3,cv.CV_8U));
    cv.findContours(edges,contours,hierarchy,cv.RETR_EXTERNAL,cv.CHAIN_APPROX_SIMPLE);
    const imageArea=src.cols*src.rows;
    let best=null,bestArea=0;
    for(let i=0;i<contours.size();i++){
      const c=contours.get(i), peri=cv.arcLength(c,true), approx=new cv.Mat();
      cv.approxPolyDP(c,approx,0.02*peri,true);
      const area=Math.abs(cv.contourArea(approx));
      if(approx.rows===4 && area>imageArea*0.35 && area>bestArea){
        const pts=[]; for(let j=0;j<4;j++) pts.push({x:approx.intAt(j,0),y:approx.intAt(j,1)});
        best=orderQuad(pts); bestArea=area;
      }
      approx.delete(); c.delete();
    }
    return best;
  }finally{
    [gray,blur,edges,contours,hierarchy].forEach(x=>{try{x&&x.delete()}catch(e){}});
  }
}

function warpToTemplate(src){
  const W=1100,H=1550;
  const quad=findPageQuad(src);
  if(!quad){
    const out=new cv.Mat(); cv.resize(src,out,new cv.Size(W,H),0,0,cv.INTER_AREA);
    return {mat:out,warped:false};
  }
  const srcTri=cv.matFromArray(4,1,cv.CV_32FC2,quad.flatMap(p=>[p.x,p.y]));
  const dstTri=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,W-1,0,W-1,H-1,0,H-1]);
  const M=cv.getPerspectiveTransform(srcTri,dstTri), out=new cv.Mat();
  cv.warpPerspective(src,out,M,new cv.Size(W,H),cv.INTER_LINEAR,cv.BORDER_CONSTANT,new cv.Scalar(255,255,255,255));
  srcTri.delete(); dstTri.delete(); M.delete();
  return {mat:out,warped:true};
}

// Fixed template coordinates for the supplied 60-question sheet after perspective correction.
const OMR_TEMPLATE={
  W:1100,H:1550,
  groups:[
    {xs:[1027,972,921,881], y0:909},
    {xs:[752,710,665,622], y0:909},
    {xs:[472,431,389,347], y0:932},
    {xs:[224,182,139,94],  y0:932}
  ],
  dy:34,
  radius:9,
  // The sheet prints choices from left to right as د ج ب أ.
  labels:['د','ج','ب','أ']
};

function sampleBubble(gray,x,y,r=9){
  let sum=0,count=0,dark=0;
  const r2=r*r;
  for(let yy=Math.max(0,y-r);yy<=Math.min(gray.rows-1,y+r);yy++){
    for(let xx=Math.max(0,x-r);xx<=Math.min(gray.cols-1,x+r);xx++){
      const dx=xx-x,dy=yy-y;
      if(dx*dx+dy*dy<=r2){
        const v=gray.ucharAt(yy,xx); sum+=v; count++; if(v<150) dark++;
      }
    }
  }
  return {mean:count?sum/count:255,darkRatio:count?dark/count:0};
}

function detectOMRAnswers(warped){
  const gray=new cv.Mat(); cv.cvtColor(warped,gray,cv.COLOR_RGBA2GRAY);
  const answers={}, confidence={}, review=[];
  const stats=[];
  for(let g=0;g<4;g++){
    const group=OMR_TEMPLATE.groups[g];
    for(let row=0;row<15;row++){
      const q=g*15+row+1;
      const y=Math.round(group.y0+row*OMR_TEMPLATE.dy);
      const scores=group.xs.map(x=>{
        const s=sampleBubble(gray,x,y,OMR_TEMPLATE.radius);
        // darkRatio is the primary signal; mean is a useful secondary signal.
        return 0.72*s.darkRatio + 0.28*(1-s.mean/255);
      });
      const order=scores.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v);
      const best=order[0], second=order[1];
      const margin=best.v-second.v;
      // Blank: all four interiors are bright. Do not treat blank as an error.
      const blank=best.v<0.14;
      if(!blank){
        answers[q]=OMR_TEMPLATE.labels[best.i];
        confidence[q]=Math.max(0,Math.min(1,margin*2.8 + best.v));
        // Multiple/weak marks: require human review.
        if(best.v<0.25 || margin<0.045) review.push(q);
      }
      stats.push({q,scores,blank,best:best.v,margin});
    }
  }
  gray.delete();
  return {answers,confidence,review,stats};
}

async function readOMRImage(file){
  await waitForOpenCV();
  const img=await loadImageElement(file);
  const canvas=document.createElement('canvas');
  canvas.width=img.naturalWidth; canvas.height=img.naturalHeight;
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(img,0,0);
  const src=cv.imread(canvas);
  const warpedInfo=warpToTemplate(src);
  const detected=detectOMRAnswers(warpedInfo.mat);
  warpedInfo.mat.delete(); src.delete();
  return {...detected,warped:warpedInfo.warped};
}

async function uploadAndProcessOMR(){
  const exam = STATE.exams.find(e=>e.id===document.getElementById('gExam')?.value);
  const msg = document.getElementById('omrProcessMsg');
  if(!exam){ if(msg) msg.textContent='اختر الاختبار أولاً'; return; }
  if(!OMR_SELECTED_FILES.length){ if(msg) msg.textContent='اختر صور أوراق الإجابة أولاً'; return; }
  const students=STATE.students.filter(s=>s.class_id===exam.class_id);
  if(OMR_SELECTED_FILES.length>students.length){
    if(!confirm(`عدد الصور (${OMR_SELECTED_FILES.length}) أكبر من عدد الطلاب (${students.length}). سيتم استخدام أول ${students.length} صورة فقط. متابعة؟`)) return;
  }
  const n=Math.min(OMR_SELECTED_FILES.length,students.length);
  if(msg) msg.innerHTML='<div class="omr-progress"><strong>جاري تشغيل محرك OMR...</strong><br>سيتم رفع الصورة وقراءة الدوائر وربطها بالطالب حسب الترتيب.</div>';
  try{ await waitForOpenCV(); }catch(e){ if(msg) msg.textContent=e.message; return; }

  for(let i=0;i<n;i++){
    const file=OMR_SELECTED_FILES[i], student=students[i];
    try{
      if(msg) msg.innerHTML=`<div class="omr-progress"><strong>قراءة الورقة ${i+1} من ${n}</strong><br>${escapeHtml(student.name)}</div>`;
      const read=await readOMRImage(file);
      const safeName=file.name.replace(/[^\w\u0600-\u06FF.-]+/g,'_').slice(0,100);
      const path=`${exam.id}/${String(i+1).padStart(3,'0')}_${student.id}_${Date.now()}_${safeName}`;
      const upload=await sb.storage.from('exam-sheets').upload(path,file,{upsert:true,contentType:file.type||'image/jpeg'});
      if(upload.error) throw upload.error;
      const status=read.review.length?'review':'processed';
      const sheetPayload={exam_id:exam.id,student_id:student.id,sheet_order:i+1,image_path:path,status,
        detected_answers:read.answers,confidence:read.confidence,review_questions:read.review,
        requires_review:read.review.length>0,error_message:null,processed_at:new Date().toISOString(),approved_at:null};
      const {error:dbError}=await sb.from('exam_sheets').upsert(sheetPayload,{onConflict:'exam_id,student_id'});
      if(dbError) throw dbError;
      if(msg) msg.innerHTML=`<div class="omr-progress"><strong>تمت قراءة ${i+1} من ${n}</strong><br>${escapeHtml(student.name)} — ${Object.keys(read.answers).length} إجابة، ${read.review.length} للمراجعة.</div>`;
    }catch(err){
      console.error(err);
      await sb.from('exam_sheets').upsert({exam_id:exam.id,student_id:student.id,sheet_order:i+1,status:'error',error_message:err.message||'خطأ غير معروف'},{onConflict:'exam_id,student_id'});
      if(msg) msg.innerHTML=`<div class="omr-progress"><strong>خطأ في ورقة ${escapeHtml(student.name)}</strong><br>${escapeHtml(err.message||'')}</div>`;
    }
  }
  toast(`تمت قراءة ${n} ورقة`);
  await renderOMRSheets(exam.id);
}

            <th>الأسئلة المقروءة</th>
            <th>المراجعة</th>
            <th>إجراء</th>
          </tr>
        </thead>
        <tbody>
          ${(sheets || []).map(sheet=>{
            const student = STATE.students.find(s=>s.id===sheet.student_id);
            const count = Object.keys(sheet.detected_answers || {}).length;
            const reviewCount = Array.isArray(sheet.review_questions)
              ? sheet.review_questions.length
              : 0;

            let statusText = 'مرفوعة';
            if(sheet.status === 'processed') statusText = 'تمت القراءة';
            if(sheet.status === 'review') statusText = 'تحتاج مراجعة';
            if(sheet.status === 'approved') statusText = 'معتمدة';
            if(sheet.status === 'error') statusText = 'خطأ';

            return `
              <tr>
                <td>${sheet.sheet_order}</td>
                <td>${student ? escapeHtml(student.name) : '—'}</td>
                <td>${statusText}</td>
                <td>${count}/${exam.total_questions}</td>

        </tbody>

  `;

  document.getElementById('gradingBody')?.after(card);
}

async function openOMRSheet(sheetId){
  const { data: sheet, error } = await sb
    .from('exam_sheets')
    .select('*')
    .eq('id', sheetId)
    .maybeSingle();

  if(error || !sheet){
    toast('تعذر فتح الورقة');
    return;
  }

  const student = STATE.students.find(s=>s.id===sheet.student_id);
  const exam = STATE.exams.find(e=>e.id===sheet.exam_id);

  let imageUrl = '';

  if(sheet.image_path){
    const signed = await sb.storage
      .from('exam-sheets')
      .createSignedUrl(sheet.image_path, 3600);

    if(!signed.error) imageUrl = signed.data.signedUrl;
  }

  const box = document.getElementById('answerEntryBox');

  if(!box) return;

  const answers = sheet.detected_answers || {};
  const review = Array.isArray(sheet.review_questions)
    ? sheet.review_questions
    : [];
  const confidence = sheet.confidence || {};

  let html = `
    <div class="card">
      <h3 style="font-size:15px;">
        مراجعة ورقة: ${escapeHtml(student?.name || '—')}
      </h3>

      <p class="muted">
        حالة الورقة: ${escapeHtml(sheet.status)}
        ${review.length ? ` — تحتاج مراجعة ${review.length} سؤال` : ''}
      </p>

      ${imageUrl ? `
        <div style="margin-top:12px;text-align:center;">
          <img src="${imageUrl}"
               style="max-width:100%;max-height:650px;object-fit:contain;border:1px solid var(--line);border-radius:8px;">
        </div>
      ` : ''}

      <div class="bubbleGrid" style="margin-top:15px;">
  `;

  for(let q=1;q<=exam.total_questions;q++){
    html += `
      <div class="qrow">
        <span class="qnum">${q}</span>
        <span class="omr-confidence">${answers[q] ? Math.round((Number(confidence[q]||0))*100)+'%' : 'فارغ'}</span>
        ${LETTERS.map(l=>`
          <button
            class="opt${answers[q]===l?' sel':''}
            ${review.includes(q)?'wrong-mark':''}"
            id="omr_${sheet.id}_${q}_${l}"
            onclick="setOMRAnswer('${sheet.id}',${q},'${l}')">
            ${l}
          </button>
        `).join('')}
      </div>
    `;
  }

  html += `
      </div>

      <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn"
          onclick="approveOMRSheet('${sheet.id}')">
          اعتماد وتصحيح النتيجة
        </button>

        <button class="btn secondary"
          onclick="saveOMRManualAnswers('${sheet.id}')">
          حفظ الإجابات المعدلة
        </button>
      </div>
    </div>
  `;

  box.innerHTML = html;
  box.scrollIntoView({behavior:'smooth'});
}

async function setOMRAnswer(sheetId, q, l){
  const buttons = document.querySelectorAll(
    `[id^="omr_${sheetId}_${q}_"]`
  );

  buttons.forEach(b=>{
    b.classList.toggle(
      'sel',
      b.id === `omr_${sheetId}_${q}_${l}`
    );
  });

  const { data: sheet } = await sb
    .from('exam_sheets')
    .select('detected_answers')
    .eq('id', sheetId)
    .maybeSingle();

  if(!sheet) return;

  const answers = {...(sheet.detected_answers || {})};
  answers[q] = l;

  await sb
    .from('exam_sheets')
    .update({
      detected_answers: answers,
      status: 'review',
      requires_review: true
    })
    .eq('id', sheetId);
}

async function saveOMRManualAnswers(sheetId){
  const { data: sheet } = await sb
    .from('exam_sheets')
    .select('*')
    .eq('id', sheetId)
    .maybeSingle();

  if(!sheet){
    toast('الورقة غير موجودة');
    return;
  }

  await sb
    .from('exam_sheets')
    .update({
      status:'processed',
      updated_at:new Date().toISOString()
    })
    .eq('id', sheetId);

  toast('تم حفظ تعديلات الإجابات');
}

async function approveOMRSheet(sheetId){
  const { data: sheet, error } = await sb
    .from('exam_sheets')
    .select('*')
    .eq('id', sheetId)
    .maybeSingle();

  if(error || !sheet){
    toast('تعذر قراءة الورقة');
    return;
  }

  const exam = STATE.exams.find(e=>e.id===sheet.exam_id);

  if(!exam){
    toast('الاختبار غير موجود');
    return;
  }

  const answers = sheet.detected_answers || {};

  const { correct, total_percent, subjectScores } =
    computeScore(answers, exam);

  const payload = {
    exam_id: sheet.exam_id,
    student_id: sheet.student_id,
    answers,
    correct_count: correct,
    total_percent,
    subject_scores: subjectScores,
    updated_at: new Date().toISOString()
  };

  const { error: resultError } = await sb
    .from('results')
    .upsert(payload, {
      onConflict:'exam_id,student_id'
    });

  if(resultError){
    toast('تعذر حفظ النتيجة');
    console.error(resultError);
    return;
  }

  const { error: sheetError } = await sb
    .from('exam_sheets')
    .update({
      status:'approved',
      requires_review:false,
      approved_at:new Date().toISOString(),
      processed_at:new Date().toISOString()
    })
    .eq('id', sheetId);

  if(sheetError){
    toast('تم حفظ النتيجة لكن تعذر اعتماد الورقة');
    return;
  }

  toast(`تم اعتماد ${correct}/${exam.total_questions}`);

  await onGradingExamChange();
}

async function loadOMRSheetsForCurrentExam(){
  const examId = document.getElementById('gExam')?.value;
  if(examId) await renderOMRSheets(examId);
}


function parseAnswerLine(line, total){
  const map = {'A':'أ','B':'ب','C':'ج','D':'د','a':'أ','b':'ب','c':'ج','d':'د'};
  const tokens = line.trim().split(/[\s,،\|]+/).filter(Boolean);
  let chars;
  if(tokens.length === total){ chars = tokens; }
  else { chars = line.replace(/[\s,،\|]+/g,'').split(''); }
  const answers = {};
  for(let q=1;q<=total;q++){
    let c = chars[q-1];
    if(!c) continue;
    if(map[c]) c = map[c];
    if(LETTERS.includes(c)) answers[q]=c;
  }
  return answers;
}
async function bulkImportAnswers(examId, classId){
  const exam = STATE.exams.find(e=>e.id===examId);
  const students = STATE.students.filter(s=>s.class_id===classId);
  const lines = document.getElementById('bulkImportBox').value.split('\n').map(l=>l.trim()).filter(Boolean);
  const msg = document.getElementById('bulkImportMsg');
  if(!lines.length){ msg.textContent = 'الصق سطراً واحداً على الأقل'; return; }
  if(lines.length !== students.length){
    if(!confirm(`عدد الأسطر (${lines.length}) لا يساوي عدد الطلاب (${students.length}). سيتم مطابقة أول ${Math.min(lines.length, students.length)} فقط. متابعة؟`)) return;
  }
  const n = Math.min(lines.length, students.length);
  const payloads = [];
  for(let i=0;i<n;i++){
    const answers = parseAnswerLine(lines[i], exam.total_questions);
    const { correct, total_percent, subjectScores } = computeScore(answers, exam);
    payloads.push({ exam_id:examId, student_id:students[i].id, answers, correct_count:correct, total_percent, subject_scores:subjectScores, updated_at:new Date().toISOString() });
  }
  const { error } = await sb.from('results').upsert(payloads, { onConflict:'exam_id,student_id' });
  if(error){ msg.textContent = 'تعذّر الاستيراد: '+error.message; return; }
  msg.textContent = `تم استيراد وتصحيح ${n} طالباً بنجاح`;
  toast('تم الاستيراد الجماعي');
  onGradingExamChange();
}

async function renderResults(){
  const main = document.getElementById('mainView');
  if(!STATE.exams.length){ main.innerHTML = `<div class="viewHead"><h2>نتائج اختبار</h2></div><div class="empty">لا توجد اختبارات بعد</div>`; return; }
  main.innerHTML = `
    <div class="viewHead"><div><h2>نتائج اختبار</h2><p class="sub">تحليل الفصل ككل، والمقارنة بالاختبار السابق لنفس الفصل</p></div></div>
    <div class="card"><div class="field" style="max-width:420px;"><label>الاختبار</label>
      <select id="rExam" onchange="renderResultsBody()">${STATE.exams.map(e=>{
        const c = STATE.classes.find(c=>c.id===e.class_id);
        return `<option value="${e.id}">${e.name} — ${c?c.name:''} — ${e.exam_date}</option>`;
      }).join('')}</select>
    </div></div>
    <div id="resultsBody"></div>`;
  renderResultsBody();
}
async function renderResultsBody(){
  const exam = STATE.exams.find(e=>e.id===document.getElementById('rExam').value);
  const cls = STATE.classes.find(c=>c.id===exam.class_id);
  const { data: results } = await sb.from('results').select('*').eq('exam_id', exam.id);
  const body = document.getElementById('resultsBody');
  if(!results || !results.length){ body.innerHTML = `<div class="empty">لم تُصحَّح أي إجابات لهذا الاختبار بعد</div>`; return; }

  const subjects = Object.keys(exam.subjects);
  const classAvg = {}; subjects.forEach(s=>classAvg[s]=0);
  let totalAvg = 0;
  results.forEach(r=>{ totalAvg += r.total_percent; subjects.forEach(s=> classAvg[s] += (r.subject_scores[s]?.percent||0)); });
  totalAvg = fmt(totalAvg/results.length);
  subjects.forEach(s=> classAvg[s] = fmt(classAvg[s]/results.length));
  const weakest = subjects.slice().sort((a,b)=>classAvg[a]-classAvg[b])[0];

  // مقارنة بالاختبار السابق لنفس الفصل
  const prevExams = STATE.exams.filter(e=>e.class_id===exam.class_id && e.exam_date < exam.exam_date).sort((a,b)=> b.exam_date.localeCompare(a.exam_date));
  let compareHtml = '<p class="muted">لا يوجد اختبار سابق لهذا الفصل للمقارنة</p>';
  if(prevExams.length){
    const prev = prevExams[0];
    const { data: prevResults } = await sb.from('results').select('*').eq('exam_id', prev.id);
    if(prevResults && prevResults.length){
      const prevAvg = {}; let prevTotal=0;
      Object.keys(prev.subjects).forEach(s=>prevAvg[s]=0);
      prevResults.forEach(r=>{ prevTotal += r.total_percent; Object.keys(prev.subjects).forEach(s=> prevAvg[s] += (r.subject_scores[s]?.percent||0)); });
      prevTotal = fmt(prevTotal/prevResults.length);
      Object.keys(prevAvg).forEach(s=> prevAvg[s]=fmt(prevAvg[s]/prevResults.length));
      const dTotal = fmt(totalAvg - prevTotal);
      compareHtml = `<p>مقارنة بـ "${prev.name}" (${prev.exam_date}): المعدل العام
        <span class="delta ${dTotal>=0?'up':'down'}">${dTotal>=0?'▲':'▼'} ${Math.abs(dTotal)}%</span></p>
        <div class="row" style="margin-top:8px;">${subjects.filter(s=>prevAvg[s]!==undefined).map(s=>{
          const d = fmt(classAvg[s]-prevAvg[s]);
          return `<span class="tag">${s}: <span class="delta ${d>=0?'up':'down'}">${d>=0?'▲':'▼'} ${Math.abs(d)}%</span></span>`;
        }).join('')}</div>`;
    }
  }

  body.innerHTML = `
    <div class="grid2">
      <div class="card">
        <h3 style="font-size:15px;">ملخص الفصل — ${cls.name}</h3>
        <p style="margin:8px 0;">المعدل العام: <span class="pct ${pctClass(totalAvg)}">${totalAvg}%</span> — عدد المصحَّحين: ${results.length}</p>
        <p class="muted" style="margin-bottom:8px;">أضعف مادة للفصل: <b>${weakest}</b> (${classAvg[weakest]}%)</p>
        ${compareHtml}
      </div>
      <div class="chartBox"><canvas id="subjChart" height="180"></canvas></div>
    </div>
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:10px;">درجات الطلاب</h3>
      <table><thead><tr><th>الطالب</th><th>الدرجة</th><th>النسبة</th>${subjects.map(s=>`<th>${s}</th>`).join('')}</tr></thead>
      <tbody>${results.sort((a,b)=>b.total_percent-a.total_percent).map(r=>{
        const stu = STATE.students.find(s=>s.id===r.student_id);
        return `<tr><td>${stu?stu.name:'—'}</td><td>${r.correct_count}/${exam.total_questions}</td>
        <td><span class="pct ${pctClass(r.total_percent)}">${fmt(r.total_percent)}%</span></td>
        ${subjects.map(s=>`<td>${r.subject_scores[s]?fmt(r.subject_scores[s].percent)+'%':'—'}</td>`).join('')}</tr>`;
      }).join('')}</tbody></table>
    </div>`;

  if(STATE.chart1) STATE.chart1.destroy();
  STATE.chart1 = new Chart(document.getElementById('subjChart'), {
    type:'bar',
    data:{ labels:subjects, datasets:[{ label:'متوسط الفصل %', data:subjects.map(s=>classAvg[s]), backgroundColor:'#1f5d5a' }]},
    options:{ scales:{ y:{ beginAtZero:true, max:100 } }, plugins:{ legend:{display:false} } }
  });
}

async function renderStudentProfileBody(){

      <td><span class="pct ${pctClass(x.r.total_percent)}">${fmt(x.r.total_percent)}%</span></td>
      ${allSubjects.map(s=>`<td>${x.r.subject_scores[s]?fmt(x.r.subject_scores[s].percent)+'%':'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

  const colors = ['#1f5d5a','#c08a2e','#a8432c','#4a6fa5'];
  const datasets = [{ label:'المعدل العام', data: rows.map(x=>x.r.total_percent), borderColor:'#111', backgroundColor:'#111', tension:.3 }];
  allSubjects.forEach((s,i)=> datasets.push({ label:s, data: rows.map(x=> x.r.subject_scores[s]?x.r.subject_scores[s].percent:null), borderColor:colors[i%colors.length], backgroundColor:colors[i%colors.length], tension:.3 }));
  if(STATE.chart2) STATE.chart2.destroy();
  STATE.chart2 = new Chart(document.getElementById('stuChart'), {
    type:'line',
    data:{ labels: rows.map(x=>x.exam.exam_date), datasets },
    options:{ scales:{ y:{ min:0, max:100 } } }

async function renderClassTrendBody(){
  const classId = document.getElementById('tClass').value;
  const cls = STATE.classes.find(c=>c.id===classId);
  const exams = STATE.exams.filter(e=>e.class_id===classId).sort((a,b)=>a.exam_date.localeCompare(b.exam_date));
  const body = document.getElementById('trendBody');
  if(!exams.length){ body.innerHTML = `<div class="empty">لا توجد اختبارات لهذا الفصل بعد</div>`; return; }

  const points = [];
  for(const exam of exams){
    const { data: results } = await sb.from('results').select('*').eq('exam_id', exam.id);
    if(!results || !results.length) continue;
    const subjAvg = {};
    Object.keys(exam.subjects).forEach(s=> subjAvg[s] = fmt(results.reduce((a,r)=>a+(r.subject_scores[s]?.percent||0),0)/results.length));
    const totalAvg = fmt(results.reduce((a,r)=>a+r.total_percent,0)/results.length);
    points.push({ exam, totalAvg, subjAvg });
  }
  if(!points.length){ body.innerHTML = `<div class="empty">لا توجد نتائج مصحَّحة لهذا الفصل بعد</div>`; return; }

  body.innerHTML = `<div class="chartBox"><canvas id="classTrendChart" height="150"></canvas></div>
    <div class="card"><table><thead><tr><th>الاختبار</th><th>التاريخ</th><th>المعدل العام</th></tr></thead>
    <tbody>${points.slice().reverse().map(p=>`<tr><td>${p.exam.name}${p.exam.is_simulated?' <span class="tag">محاكي</span>':''}</td><td>${p.exam.exam_date}</td><td><span class="pct ${pctClass(p.totalAvg)}">${p.totalAvg}%</span></td></tr>`).join('')}</tbody></table></div>`;

  const allSubjects = [...new Set(points.flatMap(p=>Object.keys(p.subjAvg)))];
  const colors = ['#1f5d5a','#c08a2e','#a8432c','#4a6fa5'];
  const datasets = [{ label:'المعدل العام', data: points.map(p=>p.totalAvg), borderColor:'#111', backgroundColor:'#111', tension:.3 }];
  allSubjects.forEach((s,i)=> datasets.push({ label:s, data: points.map(p=>p.subjAvg[s]??null), borderColor:colors[i%colors.length], backgroundColor:colors[i%colors.length], tension:.3 }));
  if(STATE.chart1) STATE.chart1.destroy();
  STATE.chart1 = new Chart(document.getElementById('classTrendChart'), {
    type:'line',
    data:{ labels: points.map(p=>p.exam.exam_date), datasets },
    options:{ scales:{ y:{ min:0, max:100 } } }
  });
}
